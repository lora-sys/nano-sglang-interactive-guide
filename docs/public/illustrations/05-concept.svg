<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Radix prefix reuse</title><desc id="d">Two prompts share a token prefix. Shared prefix KV blocks are reused while only unique suffix tokens require new prefill work.</desc>
<rect width="1200" height="400" rx="24" fill="#0b0b0b"/><text x="52" y="44" fill="#ffca28" font-family="Inter,Arial" font-size="13" font-weight="800" letter-spacing="2">NANO-SGLANG · RADIXATTENTION</text>
<text x="52" y="83" fill="#ddd" font-family="Inter,Arial" font-size="14">PROMPT A / B</text><g font-family="ui-monospace,monospace" font-size="13"><text x="52" y="112" fill="#ffdf73">system → you → are → helpful</text><text x="278" y="112" fill="#aaa">→ explain → kv → cache</text><text x="52" y="138" fill="#ffdf73">system → you → are → helpful</text><text x="278" y="138" fill="#aaa">→ explain → radix → attention</text></g>
<path d="M520 125H592" stroke="#ffca28" stroke-width="2"/><path d="M584 117l10 8-10 8" fill="none" stroke="#ffca28" stroke-width="2"/>
<g font-family="ui-monospace,monospace" font-size="13"><rect x="612" y="70" width="520" height="188" rx="16" fill="#111" stroke="#333"/><text x="640" y="99" fill="#ddd" font-family="Inter,Arial" font-weight="700">RADIX TREE</text><text x="660" y="130" fill="#ddd">root</text><text x="684" y="154" fill="#ffdf73">└─ system</text><text x="708" y="178" fill="#ffdf73">└─ you → are → helpful</text><text x="772" y="204" fill="#aaa">├─ explain → kv → cache</text><text x="772" y="230" fill="#aaa">└─ explain → radix → attention</text></g>
<text x="52" y="292" fill="#ddd" font-family="Inter,Arial" font-size="14">KV BLOCKS</text><g><rect x="52" y="310" width="62" height="30" rx="6" fill="#332a09" stroke="#7a671c"/><rect x="120" y="310" width="62" height="30" rx="6" fill="#332a09" stroke="#7a671c"/><rect x="188" y="310" width="62" height="30" rx="6" fill="#332a09" stroke="#7a671c"/><rect x="256" y="310" width="62" height="30" rx="6" fill="#332a09" stroke="#7a671c"/><rect x="324" y="310" width="62" height="30" rx="6" fill="#171717" stroke="#444"/><rect x="392" y="310" width="62" height="30" rx="6" fill="#171717" stroke="#444"/><rect x="460" y="310" width="62" height="30" rx="6" fill="#171717" stroke="#444"/></g>
<text x="52" y="366" fill="#ffdf73" font-family="Inter,Arial" font-size="12">reused prefix KV</text><text x="324" y="366" fill="#888" font-family="Inter,Arial" font-size="12">new suffix KV / prefill</text><text x="720" y="330" fill="#ddd" font-family="Inter,Arial" font-size="17" font-weight="700">prefix hit changes scheduler work</text><text x="720" y="356" fill="#888" font-family="ui-monospace,monospace" font-size="13">extend_tokens = total_tokens − matched_prefix_tokens</text></svg>
