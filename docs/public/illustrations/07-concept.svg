<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Chunked prefill scheduling</title><desc id="d">A large prefill is split into chunks so decode work can receive scheduling opportunities between chunks.</desc>
<rect width="1200" height="360" rx="24" fill="#faf7f0"/><text x="52" y="44" fill="#c7840c" font-family="Inter,Arial" font-size="13" font-weight="800" letter-spacing="2">NANO-SGLANG · CHUNKED PREFILL</text>
<text x="52" y="92" fill="#5c5744" font-family="Inter,Arial" font-size="12">ONE LARGE PREFILL</text><rect x="190" y="72" width="900" height="42" rx="8" fill="#332a09" stroke="#725f19"/><text x="640" y="98" text-anchor="middle" fill="#ffe68b" font-family="ui-monospace,monospace" font-size="13">PREFILL 2048 TOKENS · one long scheduling interval</text>
<text x="52" y="172" fill="#5c5744" font-family="Inter,Arial" font-size="12">CHUNKED</text><g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle"><rect x="190" y="150" width="205" height="42" rx="8" fill="#332a09" stroke="#725f19"/><text x="292" y="176" fill="#ffe68b">P1 · 512</text><rect x="405" y="150" width="205" height="42" rx="8" fill="#332a09" stroke="#725f19"/><text x="507" y="176" fill="#ffe68b">P2 · 512</text><rect x="620" y="150" width="205" height="42" rx="8" fill="#332a09" stroke="#725f19"/><text x="722" y="176" fill="#ffe68b">P3 · 512</text><rect x="835" y="150" width="205" height="42" rx="8" fill="#332a09" stroke="#725f19"/><text x="937" y="176" fill="#ffe68b">P4 · 512</text></g>
<text x="52" y="246" fill="#5c5744" font-family="Inter,Arial" font-size="12">DECODE PEER</text><g><rect x="405" y="224" width="84" height="34" rx="7" fill="#f5efe0" stroke="#444"/><text x="447" y="246" text-anchor="middle" fill="#eee" font-family="ui-monospace,monospace" font-size="12">D1</text><rect x="620" y="224" width="84" height="34" rx="7" fill="#f5efe0" stroke="#444"/><text x="662" y="246" text-anchor="middle" fill="#eee" font-family="ui-monospace,monospace" font-size="12">D2</text><rect x="835" y="224" width="84" height="34" rx="7" fill="#f5efe0" stroke="#444"/><text x="877" y="246" text-anchor="middle" fill="#eee" font-family="ui-monospace,monospace" font-size="12">D3</text></g>
<path d="M405 207v12M620 207v12M835 207v12" stroke="#ffca28" stroke-width="2" stroke-dasharray="4 4"/><text x="190" y="318" fill="#1f1d17" font-family="Inter,Arial" font-size="16" font-weight="700">chunk size changes scheduling granularity, not total prompt tokens</text><text x="190" y="340" fill="#9e9784" font-family="Inter,Arial" font-size="12">smaller chunks → more scheduling turns · larger chunks → larger uninterrupted prefill work</text></svg>
