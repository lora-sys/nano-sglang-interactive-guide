<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Parallelism strategies by bottleneck</title><desc id="d">Different bottlenecks map to different topology hypotheses: TP, DP, EP, PD disaggregation, and hierarchical KV cache.</desc>
<rect width="1200" height="430" rx="24" fill="#0b0b0b"/><text x="52" y="44" fill="#ffca28" font-family="Inter,Arial" font-size="13" font-weight="800" letter-spacing="2">NANO-SGLANG · SCALE OUT BY BOTTLENECK</text>
<rect x="430" y="74" width="340" height="64" rx="14" fill="#17150d" stroke="#6d5d1d"/><text x="600" y="102" text-anchor="middle" fill="#ffdf73" font-family="Inter,Arial" font-size="18" font-weight="800">WHAT IS THE BOTTLENECK?</text><text x="600" y="124" text-anchor="middle" fill="#9e9369" font-family="Inter,Arial" font-size="11">model · requests · experts · lifecycle · KV tier</text>
<g font-family="Inter,Arial"><rect x="52" y="190" width="205" height="150" rx="16" fill="#111" stroke="#333"/><text x="76" y="222" fill="#f5f5f5" font-size="20" font-weight="800">TP</text><text x="76" y="248" fill="#aaa" font-size="12">split model tensors</text><text x="76" y="286" fill="#777" font-size="11">same request</text><text x="76" y="307" fill="#777" font-size="11">collective comm</text><rect x="273" y="190" width="205" height="150" rx="16" fill="#111" stroke="#333"/><text x="297" y="222" fill="#f5f5f5" font-size="20" font-weight="800">DP</text><text x="297" y="248" fill="#aaa" font-size="12">split requests</text><text x="297" y="286" fill="#777" font-size="11">replicas</text><text x="297" y="307" fill="#777" font-size="11">load balance</text><rect x="494" y="190" width="205" height="150" rx="16" fill="#111" stroke="#333"/><text x="518" y="222" fill="#f5f5f5" font-size="20" font-weight="800">EP</text><text x="518" y="248" fill="#aaa" font-size="12">split experts</text><text x="518" y="286" fill="#777" font-size="11">token routing</text><text x="518" y="307" fill="#777" font-size="11">expert balance</text><rect x="715" y="190" width="205" height="150" rx="16" fill="#17150d" stroke="#6d5d1d"/><text x="739" y="222" fill="#ffdf73" font-size="20" font-weight="800">PD</text><text x="739" y="248" fill="#c6b873" font-size="12">split lifecycle</text><text x="739" y="286" fill="#8f865f" font-size="11">prefill → KV handoff</text><text x="739" y="307" fill="#8f865f" font-size="11">→ decode</text><rect x="936" y="190" width="212" height="150" rx="16" fill="#111" stroke="#333"/><text x="960" y="222" fill="#f5f5f5" font-size="20" font-weight="800">HiCache</text><text x="960" y="248" fill="#aaa" font-size="12">split cache tiers</text><text x="960" y="286" fill="#777" font-size="11">GPU → host</text><text x="960" y="307" fill="#777" font-size="11">→ distributed</text></g>
<path d="M600 140V168M154 168H1042" stroke="#555" stroke-width="2"/><path d="M154 168V184M375 168V184M596 168V184M817 168V184M1042 168V184" stroke="#555" stroke-width="2"/><text x="52" y="388" fill="#ddd" font-family="Inter,Arial" font-size="16" font-weight="700">parallelism is a topology hypothesis, not a bag of launch flags</text><text x="52" y="411" fill="#777" font-family="Inter,Arial" font-size="12">state placement + communication boundary + workload evidence decide whether the hypothesis is useful</text></svg>
