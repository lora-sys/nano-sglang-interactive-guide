<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">CPU GPU overlap scheduler</title><desc id="d">Serial CPU preparation and GPU forward are compared with a pipeline where CPU preparation for the next step overlaps current GPU execution.</desc>
<rect width="1200" height="360" rx="24" fill="#faf7f0"/><text x="52" y="44" fill="#c7840c" font-family="Inter,Arial" font-size="13" font-weight="800" letter-spacing="2">NANO-SGLANG · OVERLAP SCHEDULER</text>
<text x="52" y="98" fill="#5c5744" font-family="Inter,Arial" font-size="12">SERIAL</text><g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle"><rect x="160" y="76" width="110" height="38" rx="7" fill="#332a09"/><text x="215" y="100" fill="#ffe68b">CPU 1</text><rect x="274" y="76" width="190" height="38" rx="7" fill="#181818" stroke="#444"/><text x="369" y="100" fill="#eee">GPU 1</text><rect x="468" y="76" width="110" height="38" rx="7" fill="#332a09"/><text x="523" y="100" fill="#ffe68b">CPU 2</text><rect x="582" y="76" width="190" height="38" rx="7" fill="#181818" stroke="#444"/><text x="677" y="100" fill="#eee">GPU 2</text><rect x="776" y="76" width="110" height="38" rx="7" fill="#332a09"/><text x="831" y="100" fill="#ffe68b">CPU 3</text><rect x="890" y="76" width="190" height="38" rx="7" fill="#181818" stroke="#444"/><text x="985" y="100" fill="#eee">GPU 3</text></g>
<text x="52" y="198" fill="#5c5744" font-family="Inter,Arial" font-size="12">OVERLAP</text><g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle"><rect x="160" y="174" width="110" height="38" rx="7" fill="#332a09"/><text x="215" y="198" fill="#ffe68b">CPU 1</text><rect x="274" y="174" width="230" height="38" rx="7" fill="#181818" stroke="#444"/><text x="389" y="198" fill="#eee">GPU 1</text><rect x="326" y="220" width="110" height="28" rx="6" fill="#332a09"/><text x="381" y="239" fill="#ffe68b">CPU 2</text><rect x="508" y="174" width="230" height="38" rx="7" fill="#181818" stroke="#444"/><text x="623" y="198" fill="#eee">GPU 2</text><rect x="560" y="220" width="110" height="28" rx="6" fill="#332a09"/><text x="615" y="239" fill="#ffe68b">CPU 3</text><rect x="742" y="174" width="230" height="38" rx="7" fill="#181818" stroke="#444"/><text x="857" y="198" fill="#eee">GPU 3</text></g>
<text x="160" y="300" fill="#1f1d17" font-family="Inter,Arial" font-size="17" font-weight="700">steady-state period ≈ max(CPU prepare, GPU forward)</text><text x="160" y="327" fill="#9e9784" font-family="Inter,Arial" font-size="12">overlap hides waiting gaps; it does not erase CPU work or shorten the GPU kernel itself</text></svg>
