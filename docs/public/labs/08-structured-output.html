<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>08 · Grammar Mask</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">08 · Logits → Grammar Mask → Candidates</div><div class="sub">Structured output 不是“模型突然会写 JSON”，而是 decoding state 改变合法候选。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Grammar state</h3><select id="schema"><option value="json">JSON: {"ok": true}</option><option value="enum">Enum: red | green | blue</option></select><div id="states" class="flow" style="margin-top:10px"></div><button class="btn" id="next">Next state →</button><div id="trace" class="trace" style="height:150px;margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section><section class="panel"><h3>Allowed next tokens</h3><div class="tokens" id="allowed"></div><h3 style="margin-top:16px">Masked teaching candidates</h3><div class="tokens" id="masked"></div><div class="metrics" style="margin-top:12px"><div class="metric"><b id="allowN">0</b><span>allowed</span></div><div class="metric"><b id="maskN">0</b><span>masked</span></div></div></section></div><div class="footer">候选词表是小型教学集合，不代表真实 vocabulary。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime();let i=0;const player=new TracePlayer({traceEl:document.getElementById('trace'),sourceEl:document.getElementById('source'),speed:220})
function draw(){const grammar=document.getElementById('schema').value,r=runtime.grammarMask({grammar,stateIndex:i});i=r.state.state_index;const total=grammar==='json'?5:2;const states=document.getElementById('states');states.replaceChildren();for(let j=0;j<total;j++){const n=document.createElement('span');n.className='state'+(j===i?' current':'');n.textContent='q'+j;states.append(n);if(j<total-1){const a=document.createElement('span');a.className='arrow';a.textContent='→';states.append(a)}}const allowed=document.getElementById('allowed'),masked=document.getElementById('masked');allowed.replaceChildren(...r.state.allowed.map(x=>tok(x,'hit')));masked.replaceChildren(...r.state.masked.slice(0,8).map(x=>tok(x,'muted')));document.getElementById('allowN').textContent=r.metrics.allowed_candidates;document.getElementById('maskN').textContent=r.metrics.masked_candidates;player.load(r.events);player.play()}
function tok(x,c){const n=document.createElement('span');n.className='tok '+c;n.textContent=x;return n}document.getElementById('next').onclick=()=>{const total=document.getElementById('schema').value==='json'?5:2;i=(i+1)%total;draw()};document.getElementById('schema').onchange=()=>{i=0;draw()};draw()
</script></body></html>
