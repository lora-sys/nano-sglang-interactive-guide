<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>11 · CPU/GPU Overlap</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">11 · CPU/GPU Overlap Pipeline</div><div class="sub">用统一 Runtime 生成时间事件；稳态节拍由 max(CPU, GPU) 决定。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Timing controls</h3><div class="controls"><div class="control"><label>CPU prepare (ms) <b id="cval"></b></label><input id="cpu" type="range" min="1" max="12" value="4"></div><div class="control"><label>GPU forward (ms) <b id="gval"></b></label><input id="gpu" type="range" min="1" max="12" value="8"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="run">Run B</button><button class="btn secondary" id="saveA">Save as A</button></div><div class="metrics" style="margin-top:12px"><div class="metric"><b id="serial">0</b><span>serial total*</span></div><div class="metric"><b id="overlap">0</b><span>ideal overlap*</span></div><div class="metric"><b id="bottleneck">—</b><span>steady bottleneck*</span></div></div><div class="callout" id="note" style="margin-top:12px"></div></section><section class="panel"><h3>4-step model</h3><div class="timeline"><div class="lane"><label>Serial</label><div class="track" id="sline"></div></div><div class="lane"><label>Overlap</label><div class="track" id="oline"></div></div></div><div id="trace" class="trace" style="height:190px;margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section></div>
<section class="panel" style="margin-top:12px"><h3>A/B Diff</h3><div id="diff" class="diff"><div class="event">Save A → 把 CPU 调到比 GPU 更慢 → Run B。</div></div></section><div class="footer">* 理想流水线教学模型，不等于真实 kernel timeline。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer,renderMetricDiff } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime();let current,baseline;const player=new TracePlayer({traceEl:document.getElementById('trace'),sourceEl:document.getElementById('source'),speed:130})
function run(){const c=+document.getElementById('cpu').value,g=+document.getElementById('gpu').value;current=runtime.overlap({cpuMs:c,gpuMs:g,steps:4});document.getElementById('cval').textContent=c;document.getElementById('gval').textContent=g;document.getElementById('serial').textContent=current.metrics.serial_total_ms+'ms';document.getElementById('overlap').textContent=current.metrics.overlap_total_ms+'ms';document.getElementById('bottleneck').textContent=current.metrics.bottleneck;document.getElementById('note').textContent=c<=g?'GPU forward 更长：理想情况下，下一步 CPU prepare 可以藏在当前 GPU 工作后面。':'CPU prepare 更长：CPU 进入稳态瓶颈，不能再说“CPU 时间被完全隐藏”。';const s=document.getElementById('sline'),o=document.getElementById('oline');s.replaceChildren();o.replaceChildren();for(let i=0;i<4;i++){let cseg=document.createElement('div');cseg.className='seg hot';cseg.style.flex=c;cseg.textContent='C'+(i+1);s.append(cseg);let gseg=document.createElement('div');gseg.className='seg gpu';gseg.style.flex=g;gseg.textContent='G'+(i+1);s.append(gseg)}let first=document.createElement('div');first.className='seg hot';first.style.flex=c;first.textContent='C1';o.append(first);for(let i=0;i<4;i++){let seg=document.createElement('div');seg.className='seg gpu';seg.style.flex=Math.max(c,g);seg.textContent=`G${i+1}${i<3?'+C'+(i+2):''}`;o.append(seg)}player.load(current.events);player.play();if(baseline)renderMetricDiff(document.getElementById('diff'),baseline.metrics,current.metrics,{a:'A',b:'B'})}
document.getElementById('run').onclick=run;document.getElementById('saveA').onclick=()=>{if(!current)run();baseline=current;{const n=document.createElement('div');n.className='event';n.textContent='A 已保存。现在改变 CPU/GPU 比例。';document.getElementById('diff').replaceChildren(n)}};document.getElementById('cpu').oninput=run;document.getElementById('gpu').oninput=run;run()
</script></body></html>
