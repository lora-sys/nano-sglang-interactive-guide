<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>09 · Sampling</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">09 · Sampling Candidate Space</div><div class="sub">temperature / top-k / top-p 不是三个“随机度”旋钮：它们依次重塑分布和候选集。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Sampling controls</h3><div class="controls"><div class="control"><label>temperature <b id="tval"></b></label><input id="temp" type="range" min="0.2" max="2" step="0.1" value="1"></div><div class="control"><label>top-k <b id="kval"></b></label><input id="topk" type="range" min="1" max="6" value="6"></div><div class="control"><label>top-p <b id="pval"></b></label><input id="topp" type="range" min="0.2" max="1" step="0.05" value="1"></div></div><div class="callout" id="summary" style="margin-top:12px"></div><div id="trace" class="trace" style="height:135px;margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section><section class="panel"><h3>Next-token teaching distribution</h3><div id="probs"></div></section></div><div class="footer">固定 logits 只用于做 perturbation；不是某个真实模型的输出。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime();const player=new TracePlayer({traceEl:document.getElementById('trace'),sourceEl:document.getElementById('source'),speed:200})
function draw(){const T=+document.getElementById('temp').value,k=+document.getElementById('topk').value,p=+document.getElementById('topp').value,r=runtime.sampling({temperature:T,topK:k,topP:p});document.getElementById('tval').textContent=T.toFixed(1);document.getElementById('kval').textContent=k;document.getElementById('pval').textContent=p.toFixed(2);document.getElementById('summary').textContent=`active candidates = ${r.metrics.active_candidates} · 先缩放 logits，再做候选过滤与归一化。`;const box=document.getElementById('probs');box.replaceChildren();for(const item of r.state.distribution){const row=document.createElement('div');row.className='prob';const name=document.createElement('span');name.textContent=item.name;const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('i');fill.style.width=(item.probability*100)+'%';bar.append(fill);const v=document.createElement('b');v.textContent=(item.probability*100).toFixed(1)+'%';row.append(name,bar,v);box.append(row)}player.load(r.events);player.play()}
['temp','topk','topp'].forEach(id=>document.getElementById(id).oninput=draw);draw()
</script></body></html>
