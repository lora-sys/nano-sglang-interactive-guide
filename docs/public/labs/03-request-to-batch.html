<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>03 · Batch Morph</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">03 · Request → ScheduleBatch → ForwardBatch</div><div class="sub">不是百分比动画：直接查看每个阶段拥有的 state 和执行 locality。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Object morph</h3><input id="stage" type="range" min="0" max="2" value="0"><div class="row" style="justify-content:space-between;font-size:10px;color:#888"><span>Req</span><span>ScheduleBatch</span><span>ForwardBatch</span></div><div id="object" class="trace" style="height:305px;margin-top:10px"></div></section><section class="panel"><h3>State Lens</h3><div class="control"><label>requests in batch</label><input id="count" type="range" min="1" max="8" value="3"></div><div class="metrics" style="margin-top:12px"><div class="metric"><b id="locality">CPU</b><span>state locality</span></div><div class="metric"><b id="gpu">NO</b><span>device-ready tensors</span></div><div class="metric"><b id="nreq">1</b><span>requests</span></div></div><div class="callout" id="why" style="margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section></div><div class="footer">重点不是对象名字，而是“控制状态何时被压成执行状态”。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js'
const runtime=new NanoSGLangRuntime(), stage=document.getElementById('stage'), count=document.getElementById('count'), box=document.getElementById('object')
const whyMap=['单请求状态：request 仍然是调度的基本单位。','Scheduler 已经决定谁一起跑，但仍然保留高层控制 metadata。','执行边界：为 ModelRunner / attention backend 准备 device-ready 数据。']
function draw(){const r=runtime.morphBatch({requestCount:+count.value,stage:+stage.value}),s=r.state;box.replaceChildren();const h=document.createElement('div');h.className='event';const strong=document.createElement('strong');strong.textContent=s.name;h.append(strong);box.append(h);for(const field of s.state.fields){const row=document.createElement('div');row.className='event';row.textContent=field;box.append(row)}document.getElementById('locality').textContent=s.state.locality.includes('CPU')?'CPU':'DEVICE';document.getElementById('gpu').textContent=s.state.gpu_tensors===true?'YES':s.state.gpu_tensors===false?'NO':'PARTIAL';document.getElementById('nreq').textContent=r.metrics.requests;document.getElementById('why').textContent=whyMap[+stage.value];const a=document.getElementById('source');a.textContent=s.source;a.href='https://github.com/sgl-project/sglang/blob/v0.5.17/'+s.source}
stage.oninput=draw;count.oninput=draw;draw()
</script></body></html>
