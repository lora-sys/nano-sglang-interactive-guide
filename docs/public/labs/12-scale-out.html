<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>12 · Parallelism Planner</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">12 · Bottleneck → Topology Hypothesis</div><div class="sub">不要从缩写开始；先声明瓶颈，再得到需要验证的 topology hypothesis。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Observed bottleneck</h3><select id="work"><option value="fit">模型单设备放不下</option><option value="throughput">独立请求吞吐不够</option><option value="moe">MoE expert / routing 很重</option><option value="pd">长 prompt 干扰 decode latency</option><option value="kv">共享 prefix KV 容量/层级受限</option></select><button class="btn" id="plan" style="margin-top:12px">Generate hypothesis</button><div class="callout" id="advice" style="margin-top:12px"></div><div id="trace" class="trace" style="height:120px;margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section><section class="panel"><h3>Topology hypothesis</h3><div id="topology" class="flow"></div><div id="details" class="trace" style="height:190px;margin-top:10px"></div></section></div><div class="footer">这不是自动选型器。它只强迫你把“瓶颈 → 并行策略 → 需要测的代价”写清楚。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime();const player=new TracePlayer({traceEl:document.getElementById('trace'),sourceEl:document.getElementById('source'),speed:220})
function draw(){const r=runtime.scaleOut({bottleneck:document.getElementById('work').value});document.getElementById('advice').textContent=r.state.advice;const topo=document.getElementById('topology');topo.replaceChildren();r.state.nodes.forEach((x,i)=>{const n=document.createElement(i%2?'span':'span');n.className=i%2?'arrow':'node active';n.textContent=x;topo.append(n)});const d=document.getElementById('details');d.replaceChildren(...r.state.evidence.map(x=>{const n=document.createElement('div');n.className='event';n.textContent=x;return n}));player.load(r.events);player.play()}
document.getElementById('plan').onclick=draw;document.getElementById('work').onchange=draw;draw()
</script></body></html>
