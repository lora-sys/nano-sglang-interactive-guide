<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>10 · Speculative Decoding</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">10 · Draft → Verify → Accept Prefix</div><div class="sub">使用确定性 seed，避免每点一次结果乱跳；重点观察“连续接受前缀”。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Spec settings</h3><div class="controls"><div class="control"><label>draft tokens <b id="dval"></b></label><input id="draft" type="range" min="1" max="8" value="4"></div><div class="control"><label>target acceptance probability <b id="aval"></b></label><input id="acc" type="range" min="10" max="100" step="10" value="80"></div><div class="control"><label>seed <b id="sval"></b></label><input id="seed" type="range" min="1" max="20" value="7"></div></div><button class="btn" id="go" style="margin-top:12px">Draft & Verify</button><div class="metrics" style="margin-top:12px"><div class="metric"><b id="accepted">0</b><span>accepted prefix</span></div><div class="metric"><b id="rejected">0</b><span>not accepted</span></div><div class="metric"><b id="observed">0%</b><span>observed ratio</span></div></div></section><section class="panel"><h3>Proposal</h3><div id="tokens" class="tokens"></div><div id="trace" class="trace" style="height:210px;margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section></div><div class="footer">概率输入不是“真实性能”；它只让你理解 acceptance 为什么决定 speculative decoding 的潜在收益。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime();const player=new TracePlayer({traceEl:document.getElementById('trace'),sourceEl:document.getElementById('source'),speed:250})
function run(){const d=+document.getElementById('draft').value,a=+document.getElementById('acc').value/100,s=+document.getElementById('seed').value;const r=runtime.speculative({draftTokens:d,acceptanceRate:a,seed:s});document.getElementById('dval').textContent=d;document.getElementById('aval').textContent=Math.round(a*100)+'%';document.getElementById('sval').textContent=s;document.getElementById('accepted').textContent=r.metrics.accepted_tokens;document.getElementById('rejected').textContent=r.metrics.rejected_tokens;document.getElementById('observed').textContent=Math.round(r.metrics.acceptance_ratio_observed*100)+'%';const box=document.getElementById('tokens');box.replaceChildren();r.state.accepted.forEach((ok,i)=>{const n=document.createElement('span');n.className='tok '+(ok?'hit':'new');n.textContent=`d${i+1} ${ok?'✓':'×'}`;box.append(n)});player.load(r.events);player.play()}
document.getElementById('go').onclick=run;['draft','acc','seed'].forEach(id=>document.getElementById(id).oninput=run);run()
</script></body></html>
