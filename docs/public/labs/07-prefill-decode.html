<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>07 · Chunked Prefill</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">07 · Chunk Size Perturbation</div><div class="sub">不是猜“哪个更快”，而是看 chunk size 会改变哪些可观测状态。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>Workload</h3><div class="controls"><div class="control"><label>prompt tokens <b id="pval"></b></label><input id="prompt" type="range" min="128" max="4096" step="128" value="2048"></div><div class="control"><label>chunk size <b id="cval"></b></label><input id="chunk" type="range" min="128" max="2048" step="128" value="512"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="run">Run B</button><button class="btn secondary" id="saveA">Save as A</button></div><div class="metrics" style="margin-top:12px"><div class="metric"><b id="chunks">0</b><span>prefill chunks</span></div><div class="metric"><b id="largest">0</b><span>largest chunk</span></div><div class="metric"><b id="turns">0</b><span>scheduler turns</span></div></div></section><section class="panel"><h3>Event Timeline</h3><div class="timeline"><div class="lane"><label>Prefill</label><div class="track" id="prefill"></div></div><div class="lane"><label>Peer decode</label><div class="track" id="decode"></div></div></div><div class="callout" id="note" style="margin-top:12px"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section></div>
<div class="grid" style="margin-top:12px"><section class="panel"><h3>Trace</h3><div id="trace" class="trace" style="height:200px"></div></section><section class="panel"><h3>A/B Diff</h3><div id="diff" class="diff"><div class="event">保存 A，单独改变 chunk size，再运行 B。</div></div></section></div><div class="footer">这个模型只比较调度结构；真实 latency / throughput 必须用真实 SGLang 测。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer,renderMetricDiff } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime();let current,baseline;const player=new TracePlayer({traceEl:document.getElementById('trace'),sourceEl:document.getElementById('source'),speed:120})
function run(){const p=+document.getElementById('prompt').value,c=+document.getElementById('chunk').value;current=runtime.chunkedPrefill({promptTokens:p,chunkSize:c,decodeSteps:5});document.getElementById('pval').textContent=p;document.getElementById('cval').textContent=c;document.getElementById('chunks').textContent=current.metrics.prefill_chunks;document.getElementById('largest').textContent=current.metrics.largest_chunk_tokens+' tok';document.getElementById('turns').textContent=current.metrics.scheduler_turns;const pre=document.getElementById('prefill'),dec=document.getElementById('decode');pre.replaceChildren();dec.replaceChildren();const chunkEvents=current.events.filter(e=>e.event==='prefill_chunk');for(const e of chunkEvents){const s=document.createElement('div');s.className='seg hot';s.style.flex=e.metrics.chunk_tokens;s.textContent='P'+e.metrics.scheduler_turn;pre.append(s)}for(let i=0;i<Math.min(5,chunkEvents.length);i++){const s=document.createElement('div');s.className='seg gpu';s.style.flex='1';s.textContent='D';dec.append(s)}document.getElementById('note').textContent=c>1200?'大 chunk：turn 少，但单次 prefill 工作块更大。':c<300?'小 chunk：单次块更细，但需要更多 scheduler turns。':'中间区域：观察它如何在“块大小”和“调度次数”之间折中。';player.load(current.events);player.play();if(baseline)renderMetricDiff(document.getElementById('diff'),baseline.metrics,current.metrics,{a:'A',b:'B'})}
document.getElementById('run').onclick=run;document.getElementById('saveA').onclick=()=>{if(!current)run();baseline=current;{const n=document.createElement('div');n.className='event';n.textContent='A 已保存。只改 chunk size，再 Run B。';document.getElementById('diff').replaceChildren(n)}};document.getElementById('prompt').oninput=run;document.getElementById('chunk').oninput=run;run()
</script></body></html>
