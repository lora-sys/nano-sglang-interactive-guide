<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lab.css"><title>02 · Runtime Architecture</title></head><body><main class="shell">
<div class="top"><div><div class="kicker">NANO-SGLANG LAB</div><div class="title">02 · Runtime Roles + One Shared Trace</div><div class="sub">点击角色看它拥有的 state；Play 则回放第一章同一类 runtime event。</div></div><div class="badge">SHARED NANO RUNTIME</div></div>
<div class="grid"><section class="panel"><h3>State ownership</h3><div class="flow" id="roles"><button class="node active" data-role="tokenizer">TokenizerManager</button><span class="arrow">→</span><button class="node" data-role="scheduler">Scheduler</button><span class="arrow">→</span><button class="node" data-role="model_runner">ModelRunner</button><span class="arrow">→</span><button class="node" data-role="detokenizer">Detokenizer</button></div><div class="callout" id="desc"></div><div class="source-line">SOURCE <a id="source" target="_blank" rel="noreferrer">—</a></div></section><section class="panel"><h3>State Lens</h3><div id="states" class="timeline"></div></section></div>
<section class="panel" style="margin-top:12px"><h3>Route one request</h3><div class="row"><button class="btn" id="play">▶ Play trace</button><button class="btn secondary" id="step">Step</button></div><div class="trace" id="trace" style="margin-top:10px;height:190px"></div></section><div class="footer">角色图是教学抽象；源码链接固定到 v0.5.17 snapshot。</div>
</main><script type="module">
import { NanoSGLangRuntime } from '../runtime/nano-runtime.js';import { TracePlayer } from '../runtime/trace-player.js'
const runtime=new NanoSGLangRuntime(),desc=document.getElementById('desc'),states=document.getElementById('states'),source=document.getElementById('source')
const data={tokenizer:{d:'外部文本世界 → tokenized request。',s:['request normalization','text / messages','request id','token ids'],src:'python/sglang/srt/managers/tokenizer_manager.py'},scheduler:{d:'控制面：决定谁进 batch、prefix 命中与资源约束。',s:['waiting queue','running batch','prefix cache refs','token/KV budget'],src:'python/sglang/srt/managers/scheduler.py'},model_runner:{d:'执行面：消费 device-ready batch，连接 attention / KV / CUDA execution。',s:['GPU tensors','KV addresses','positions / seq lens','attention metadata'],src:'python/sglang/srt/model_executor/model_runner.py'},detokenizer:{d:'token ids → 增量文本并回到 streaming API。',s:['decoded text','offset','token ids','stream chunks'],src:'python/sglang/srt/managers/detokenizer_manager.py'}}
function show(k){document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===k));desc.textContent=data[k].d;states.replaceChildren(...data[k].s.map((x,i)=>{const n=document.createElement('div');n.className='state'+(i===0?' current':'');n.textContent=x;return n}));source.textContent=data[k].src;source.href='https://github.com/sgl-project/sglang/blob/v0.5.17/'+data[k].src}
document.querySelectorAll('[data-role]').forEach(x=>x.onclick=()=>show(x.dataset.role));show('tokenizer')
const player=new TracePlayer({traceEl:document.getElementById('trace'),speed:160,onEvent:e=>{if(data[e.component])show(e.component)}});const result=runtime.generate({prompt:'route one request',maxNewTokens:2,cachedPrefixTokens:0});player.load(result.events.filter(e=>data[e.component]));document.getElementById('play').onclick=()=>{player.reset();player.play()};document.getElementById('step').onclick=()=>player.step()
</script></body></html>
