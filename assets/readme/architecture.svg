<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="at ad">
  <title id="at">nano-SGLang 交互架构</title>
  <desc id="ad">Trace Contract flowing from NanoSGLangRuntime to Trace Player, State Lens, A-B Diff, and Source Lens, with external trace import.</desc>
  <rect width="1200" height="300" rx="24" fill="#faf7f0"/>
  <text x="56" y="42" fill="#8b6914" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="14" font-weight="800" letter-spacing="2">ARCHITECTURE</text>

  <!-- Runtime box -->
  <g transform="translate(56 80)">
    <rect width="200" height="190" rx="16" fill="#f5efe0" stroke="#c7840c" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#8b6914" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">NanoSGLangRuntime</text>
    <line x1="20" y1="44" x2="180" y2="44" stroke="#d4c9a8" stroke-width="0.8"/>
    <rect x="20" y="58" width="160" height="28" rx="7" fill="#ffffff" stroke="#e5dece" stroke-width="1"/>
    <text x="100" y="77" text-anchor="middle" fill="#5c5744" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">TokenizerManager</text>
    <rect x="20" y="92" width="160" height="28" rx="7" fill="#ffffff" stroke="#e5dece" stroke-width="1"/>
    <text x="100" y="111" text-anchor="middle" fill="#5c5744" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Scheduler</text>
    <rect x="20" y="126" width="160" height="28" rx="7" fill="#ffffff" stroke="#e5dece" stroke-width="1"/>
    <text x="100" y="145" text-anchor="middle" fill="#5c5744" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">ModelRunner</text>
    <rect x="20" y="160" width="160" height="28" rx="7" fill="#ffffff" stroke="#e5dece" stroke-width="1"/>
    <text x="100" y="179" text-anchor="middle" fill="#5c5744" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">DetokenizerManager</text>
  </g>

  <path d="M268 165 H316" stroke="#c7840c" stroke-width="2.5" fill="none"/>
  <path d="M308 159 L316 165 L308 171" stroke="#c7840c" stroke-width="2.5" fill="none"/>

  <!-- Trace Contract (center hub) -->
  <g transform="translate(320 120)">
    <rect width="200" height="90" rx="16" fill="#f5efe0" stroke="#c7840c" stroke-width="1.8"/>
    <text x="100" y="42" text-anchor="middle" fill="#8b6914" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="800">Trace Contract</text>
    <text x="100" y="64" text-anchor="middle" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11">统一事件结构 / 版本校验</text>
  </g>

  <path d="M522 150 H570" stroke="#c7840c" stroke-width="2" fill="none"/>
  <path d="M562 144 L570 150 L562 156" stroke="#c7840c" stroke-width="2" fill="none"/>

  <!-- Four tool boxes -->
  <g transform="translate(570 60)">
    <g transform="translate(0 0)">
      <rect width="140" height="78" rx="14" fill="#ffffff" stroke="#d4c9a8" stroke-width="1.2"/>
      <text x="70" y="32" text-anchor="middle" fill="#1f1d17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" font-weight="700">Trace Player</text>
      <text x="70" y="52" text-anchor="middle" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11">Step / Play / Source / Diff</text>
    </g>
    <g transform="translate(158 0)">
      <rect width="140" height="78" rx="14" fill="#ffffff" stroke="#d4c9a8" stroke-width="1.2"/>
      <text x="70" y="32" text-anchor="middle" fill="#1f1d17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" font-weight="700">State Lens</text>
      <text x="70" y="52" text-anchor="middle" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11">KV Cache / Batch</text>
    </g>
    <g transform="translate(316 0)">
      <rect width="140" height="78" rx="14" fill="#ffffff" stroke="#d4c9a8" stroke-width="1.2"/>
      <text x="70" y="32" text-anchor="middle" fill="#1f1d17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" font-weight="700">A-B Diff</text>
      <text x="70" y="52" text-anchor="middle" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11">Parameter comparison</text>
    </g>
    <g transform="translate(474 0)">
      <rect width="140" height="78" rx="14" fill="#ffffff" stroke="#d4c9a8" stroke-width="1.2"/>
      <text x="70" y="32" text-anchor="middle" fill="#1f1d17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" font-weight="700">Source Lens</text>
      <text x="70" y="52" text-anchor="middle" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11">Jump to v0.5.17 source</text>
    </g>
  </g>

  <!-- Import external trace -->
  <g transform="translate(840 90)">
    <path d="M0 0 V-40" stroke="#c4bda8" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
    <path d="M-6 -46 L0 -40 L6 -46" stroke="#c4bda8" stroke-width="1.5" fill="none"/>
    <rect width="220" height="52" rx="12" fill="#ffffff" stroke="#d4c9a8" stroke-width="1.2"/>
    <text x="110" y="22" text-anchor="middle" fill="#5c5744" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">Import external JSON trace</text>
    <text x="110" y="40" text-anchor="middle" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="10">replay real GPU captures</text>
  </g>

  <text x="56" y="278" fill="#9e9784" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="13">Concept Runtime — does not execute real SGLang, GPU kernels, or CUDA Graph</text>
</svg>
